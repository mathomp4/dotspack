packages:
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]

  apple-clang:
    externals:
    - spec: apple-clang@21.0.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++

  autoconf:
    externals:
    - spec: autoconf@2.73
      prefix: /opt/homebrew

  automake:
    externals:
    - spec: automake@1.18.1
      prefix: /opt/homebrew

  bash:
    externals:
    - spec: bash@5.3.15
      prefix: /opt/homebrew

  bison:
    externals:
    - spec: bison@2.3
      prefix: /usr

  cdo:
    variants: ~proj ~fftw3
    # cdo wanted a lot of extra stuff for proj and fftw3. Turn off for now

  cmake:
    externals:
    - spec: cmake@4.4.3
      prefix: /opt/homebrew

  cvs:
    externals:
    - spec: cvs@1.12.13
      prefix: /opt/homebrew

  diffutils:
    externals:
    - spec: diffutils@3.12
      prefix: /opt/homebrew

  esmf:
    require:
    - spec: +debug
      when: platform=darwin

  flex:
    externals:
    - spec: flex@2.6.4+lex
      prefix: /usr

  gcc:
    externals:
    - spec: gcc@12.5.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-12
          cxx: /opt/homebrew/bin/g++-12
          fortran: /opt/homebrew/bin/gfortran-12
    - spec: gcc@13.4.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-13
          cxx: /opt/homebrew/bin/g++-13
          fortran: /opt/homebrew/bin/gfortran-13
    - spec: gcc@14.4.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-14
          cxx: /opt/homebrew/bin/g++-14
          fortran: /opt/homebrew/bin/gfortran-14
    - spec: gcc@15.3.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-15
          cxx: /opt/homebrew/bin/g++-15
          fortran: /opt/homebrew/bin/gfortran-15
    - spec: gcc@16.2.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-16
          cxx: /opt/homebrew/bin/g++-16
          fortran: /opt/homebrew/bin/gfortran-16

  gettext:
    externals:
    - spec: gettext@1.0
      prefix: /opt/homebrew

  git:
    externals:
    - spec: git@2.55.0~tcltk
      prefix: /opt/homebrew
    - spec: git@2.50.1~tcltk
      prefix: /usr

  git-lfs:
    externals:
    - spec: git-lfs@3.8.0
      prefix: /opt/homebrew

  go:
    externals:
    - spec: go@1.27.1
      prefix: /opt/homebrew

  graphviz:
    externals:
    - spec: graphviz@16.0.0
      prefix: /opt/homebrew

  groff:
    externals:
    - spec: groff@1.24.1
      prefix: /opt/homebrew

  libpressio:
    variants: +blosc +blosc2 +fpzip +hdf5 +mpi +netcdf +sz +sz3 +zfp

  libpressio-tools:
    variants: +hdf5 +mpi +sperr

  libtool:
    externals:
    - spec: libtool@2.6.2
      prefix: /opt/homebrew

  llvm:
    externals:
    - spec: llvm@23.1.1 ~clang +flang
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          fortran: /opt/homebrew/bin/flang

  m4:
    externals:
    - spec: m4@1.4.6
      prefix: /usr

  mapl:
    variants: +pfunit

  netcdf-c:
    variants: +dap

  ninja:
    externals:
    - spec: ninja@1.13.2
      prefix: /opt/homebrew

  npm:
    externals:
    - spec: npm@11.19.1
      prefix: /opt/homebrew

  openblas:
    prefer:
    - build_system=cmake
    variants: ~dynamic_dispatch

  openmpi:
    # Note: NAG has a bug with Open MPI >= 5.0.8
    require:
    - spec: '@5.0.7'
      when: '%nag'
    variants: +internal-hwloc +internal-libevent +internal-pmix +fortran

  openssh:
    externals:
    - spec: openssh@10.3p1
      prefix: /usr

  openssl:
    externals:
    - spec: openssl@3.6.4
      prefix: /opt/homebrew

  perl:
    externals:
    - spec: perl@5.44.0~cpanm+opcode+open+shared+threads
      prefix: /opt/homebrew
    - spec: perl@5.34.1~cpanm+opcode+open+shared+threads
      prefix: /usr

  pkgconf:
    externals:
    - spec: pkgconf@3.0.7
      prefix: /opt/homebrew

  python:
    externals:
    - spec: python@3.14.7+bz2+ctypes+dbm~freethreading+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib+zstd
      prefix: /opt/homebrew
    - spec: python@3.9.6+bz2+crypt+ctypes+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
      prefix: /usr

  rust:
    externals:
    - spec: rust@1.98.1
      prefix: /opt/homebrew
      extra_attributes:
        cargo: /opt/homebrew/bin/cargo
        compilers:
          rust: /opt/homebrew/bin/rustc

  sperr:
    variants: ~openmp

  subversion:
    externals:
    - spec: subversion@1.14.5
      prefix: /opt/homebrew

  sz3:
    variants: +hdf5

  tcsh:
    externals:
    - spec: tcsh@6.24.16
      prefix: /opt/homebrew

  texinfo:
    externals:
    - spec: texinfo@5.2
      prefix: /usr/local

  typescript:
    externals:
    - spec: typescript@7.0.2
      prefix: /opt/homebrew
